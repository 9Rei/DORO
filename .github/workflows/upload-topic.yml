name: Upload Topic

on:
  issues:
    types: [opened]

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'add-topic')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Parse issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const get = (label) => {
              const re = new RegExp(`### ${label}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`, 'i');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            };
            const subject = get('Предмет');
            const num = get('Номер темы');
            const title = get('Название темы');
            const stepsRaw = get('Шаги подготовки');
            const filesRaw = get('Файлы');

            if (!subject || !num || !title) {
              core.setFailed('Не заполнены обязательные поля');
              return;
            }

            const steps = stepsRaw.split('\n').map(s => s.trim()).filter(Boolean).join('|');
            const attachments = [];
            const re = /\[([^\]]+)\]\((https:\/\/[^\)]+)\)/g;
            let m;
            while ((m = re.exec(filesRaw)) !== null) {
              attachments.push(m[1].trim() + ":::" + m[2].trim());
            }
            if (!attachments.length) {
              const re2 = /(https:\/\/github\.com\/user-attachments\/[^\s\)]+)/g;
              while ((m = re2.exec(filesRaw)) !== null) {
                attachments.push(m[1].split('/').pop() + ":::" + m[1]);
              }
            }

            core.setOutput('subject', subject.toLowerCase());
            core.setOutput('num', num);
            core.setOutput('title', title);
            core.setOutput('steps', steps);
            core.setOutput('attachments', attachments.join('|'));

      - name: Process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT: ${{ steps.parse.outputs.subject }}
          NUM: ${{ steps.parse.outputs.num }}
          TITLE: ${{ steps.parse.outputs.title }}
          STEPS: ${{ steps.parse.outputs.steps }}
          ATTACHMENTS: ${{ steps.parse.outputs.attachments }}
        run: python process.py

      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "add ${{ steps.parse.outputs.subject }} ${{ steps.parse.outputs.num }}" || exit 0
          git push

      - name: Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Тема **${{ steps.parse.outputs.num }}** добавлена.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
