name: Add topic from issue

on:
  issues:
    types: [opened]

jobs:
  add-topic:
    if: contains(github.event.issue.labels.*.name, 'add-topic')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const get = (label) => {
              const re = new RegExp(`### ${label}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`, 'i');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            };
            const subject = get('Предмет');
            const num = get('Номер темы');
            const title = get('Название темы');
            
            if (!subject || !num || !title) {
              core.setFailed('Не заполнены обязательные поля');
              return;
            }
            
            core.setOutput('subject', subject.toLowerCase());
            core.setOutput('num', num);
            core.setOutput('title', title);

      - name: Test Bot
        env:
          SUBJECT: ${{ steps.parse.outputs.subject }}
          NUM: ${{ steps.parse.outputs.num }}
          TITLE: ${{ steps.parse.outputs.title }}
        run: |
          echo "Ура! Бот работает."
          echo "Предмет: $SUBJECT"
          echo "Номер: $NUM"
          echo "Название: $TITLE"
