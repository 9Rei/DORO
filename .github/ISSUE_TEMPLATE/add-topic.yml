name: Добавить тему
description: Добавить новую тему в раздел на сайте
title: "добавить тему"
labels: ["add-topic"]
body:
  - type: dropdown
    id: subject
    attributes:
      label: Предмет
      options:
        - биохимия
        - физиология
        - гистология
        - микробиология
        - гигиена
    validations:
      required: true

  - type: input
    id: num
    attributes:
      label: Номер темы
      placeholder: "2.2"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Название темы
      placeholder: "Транскрипция, трансляция. ДНК технологии"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги подготовки
      description: По одному на строку
      value: |
        Прочитать файл
        Выполнить тест
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Файлы
      description: Перетащи PDF сюда
    validations:
      required: true
